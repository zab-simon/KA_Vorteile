<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Karlsruhe IT Driven Development</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/recharts/umd/Recharts.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
<div id="root"></div>

<script type="text/babel">
const {useState} = React;
const {
  LineChart, Line, XAxis, YAxis, CartesianGrid,
  Tooltip, ResponsiveContainer
} = Recharts;

function Dashboard() {
  const [selectedScenario,setSelectedScenario]=useState("baseline");

  const generateProjection=(baseline,scenario)=>{
    const arr=Array.from({length:31},(_,i)=>({
      year:2025+i,baseline:baseline*Math.pow(1.02,i)
    }));
    arr.forEach(o=>{
      const i=o.year-2025, p=i/30;
      o.value= scenario==="openagi"?baseline*Math.pow(1.05,i):
               scenario==="talent"?baseline*Math.pow(1.048,i):
               scenario==="investment"?baseline*Math.pow(1.052,i):
               scenario==="crisis"?baseline*(1+(p*0.5-0.15)*(1-Math.cos(p*Math.PI))):
               o.baseline;
    });
    return arr;
  };

  const kpis=[
    {name:"City GDP Growth",unit:"€ B",baseline:28,color:"#3b82f6"},
    {name:"Private Investment",unit:"€ M/y",baseline:150,color:"#10b981"},
    {name:"Gov Funding",unit:"€ M/y",baseline:85,color:"#f59e0b"},
    {name:"High-Skill Workers",unit:"k",baseline:45,color:"#8b5cf6"},
    {name:"Employment Rate",unit:"%",baseline:92,color:"#ec4899"},
    {name:"Innovation Index",unit:"0-100",baseline:52,color:"#06b6d4"},
    {name:"Infrastructure Efficiency",unit:"0-100",baseline:65,color:"#14b8a6"},
    {name:"Public Service Effectiveness",unit:"0-100",baseline:72,color:"#f97316"},
    {name:"Active Startups",unit:"count",baseline:120,color:"#6366f1"},
    {name:"Citizen Satisfaction",unit:"/100",baseline:70,color:"#ef4444"},
  ];

  const scenarios=[
    {id:"baseline",label:"Baseline",color:"#9ca3af"},
    {id:"openagi",label:"OpenAGI Foundation",color:"#3b82f6"},
    {id:"talent",label:"Talent Influx",color:"#10b981"},
    {id:"investment",label:"Investment Boom",color:"#f59e0b"},
    {id:"crisis",label:"Economic Crisis",color:"#ef4444"},
  ];

  const benefits=Array.from({length:100},(_,i)=>({
    title:`Strategic Benefit ${i+1}`,icon:"🌐"
  }));

  const Chart=({kpi,scenario})=>{
    const data=generateProjection(kpi.baseline,scenario);
    const g=((data[30].value-data[0].baseline)/data[0].baseline*100).toFixed(0);
    return(
      <div className="bg-white p-3 rounded-lg shadow border">
        <h3 className="font-semibold text-xs">{kpi.name}</h3>
        <p className="text-xs text-gray-500">{kpi.unit}</p>
        <p className="text-sm font-bold" style={{color:kpi.color}}>
          {data[30].value.toFixed(1)}
          <span className="text-xs text-gray-600"> ({g}% by 2055)</span>
        </p>
        <ResponsiveContainer width="100%" height={120}>
          <LineChart data={data}>
            <CartesianGrid strokeDasharray="3 3" stroke="#eee"/>
            <XAxis dataKey="year" tick={{fontSize:9}}/>
            <YAxis tick={{fontSize:9}}/>
            <Tooltip formatter={v=>v.toFixed(1)} labelFormatter={l=>`Year: ${l}`}/>
            <Line type="monotone" dataKey="value" stroke={kpi.color} strokeWidth={2} dot={false}/>
          </LineChart>
        </ResponsiveContainer>
      </div>
    );
  };

  return(
  <div className="min-h-screen bg-gradient-to-br from-gray-50 to-gray-100 p-4">
    <div className="max-w-7xl mx-auto">
      <h1 className="text-3xl font-bold text-gray-900 mb-1">Karlsruhe IT Driven Development</h1>
      <p className="text-gray-600 text-sm mb-4">30-Year Projection & Benefits Dashboard</p>

      <div className="bg-white rounded-lg shadow p-4 mb-6 border">
        <h2 className="font-semibold text-gray-800 mb-3 text-sm">Select Scenario</h2>
        <div className="grid grid-cols-2 md:grid-cols-5 gap-2">
          {scenarios.map(s=>(
            <button key={s.id} onClick={()=>setSelectedScenario(s.id)}
              className={`p-2 rounded-lg text-xs font-medium transition-all ${
                selectedScenario===s.id?'ring-2 ring-offset-2 text-white':'bg-gray-100 text-gray-700 hover:bg-gray-200'}`}
              style={selectedScenario===s.id?{backgroundColor:s.color}:{}}>
              {s.label}
            </button>
          ))}
        </div>
      </div>

      <h2 className="text-xl font-bold text-gray-900 mb-3">10 KPIs (2025-2055)</h2>
      <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-3 mb-6">
        {kpis.map((k,i)=><Chart key={i} kpi={k} scenario={selectedScenario}/>)}
      </div>

      <h2 className="text-xl font-bold text-gray-900 mb-3">100 Strategic Benefits</h2>
      <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-3 mb-6">
        {benefits.map((b,i)=>(
          <div key={i} className="bg-white rounded-lg shadow p-3 border hover:shadow-md transition">
            <div className="flex items-start gap-2">
              <span className="text-2xl">{b.icon}</span>
              <p className="text-sm text-gray-700 font-medium">{b.title}</p>
            </div>
          </div>
        ))}
      </div>

      <div className="bg-white rounded-lg shadow p-5 border">
        <h2 className="text-xl font-bold text-gray-900 mb-4">Karlsruhe City Architecture (76133)</h2>
        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
          <div className="bg-blue-50 p-4 rounded-lg border border-blue-200">
            <h3 className="font-semibold text-blue-900 mb-3 text-sm">Administration & Governance</h3>
            <ul className="text-xs text-blue-800 space-y-1">
              <li>• City Council & Senate</li>
              <li>• Planning Dept</li>
              <li>• Finance & Budget</li>
              <li>• Legal & Compliance</li>
              <li>• Digital Services</li>
            </ul>
          </div>
          <div className="bg-green-50 p-4 rounded-lg border border-green-200">
            <h3 className="font-semibold text-green-900 mb-3 text-sm">Economic & Innovation</h3>
            <ul className="text-xs text-green-800 space-y-1">
              <li>• Business Development</li>
              <li>• Tech Hub & Startups</li>
              <li>• Research Institutions</li>
              <li>• Investment Attraction</li>
              <li>• Export & Trade</li>
            </ul>
          </div>
          <div className="bg-purple-50 p-4 rounded-lg border border-purple-200">
            <h3 className="font-semibold text-purple-900 mb-3 text-sm">Infrastructure & Services</h3>
            <ul className="text-xs text-purple-800 space-y-1">
              <li>• Transportation & Mobility</li>
              <li>• Utilities & Energy</li>
              <li>• Social Services</li>
              <li>• Health & Education</li>
              <li>• Environment & Sustainability</li>
            </ul>
          </div>
        </div>
      </div>

      <div className="mt-6 text-center text-xs text-gray-600">
        Interactive scenario modeling for Karlsruhe (2025-2055)
      </div>
    </div>
  </div>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<Dashboard/>);
</script>
</body>
</html>
